<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Inter, Segoe UI, system-ui, sans-serif">
<style>.bx{fill:var(--d-box,#fff7ed);stroke:var(--d-line,#b45309);stroke-width:1.5}
.bx2{fill:var(--d-box2,#eff6ff);stroke:var(--d-line2,#1d4ed8);stroke-width:1.5}
.bx3{fill:var(--d-box3,#ecfdf3);stroke:var(--d-line3,#15803d);stroke-width:1.5}
.ln{stroke:var(--d-ink,#44403c);stroke-width:1.5;fill:none}
.t{fill:var(--d-ink,#1c1b19);font-size:14px}.tb{fill:var(--d-ink,#1c1b19);font-size:14px;font-weight:600}
.ts{fill:var(--d-mute,#78716c);font-size:12px}</style>
<defs><marker id="ah-w05b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--d-ink,#44403c)"/></marker></defs>
<rect class="bx3" x="30" y="28" width="150" height="60" rx="8"/>
<text class="tb" x="105.0" y="54.0" text-anchor="middle">Standby RM</text>
<text class="ts" x="105.0" y="72.0" text-anchor="middle">ZooKeeper, &lt;60 s</text>
<rect class="bx" x="250" y="28" width="220" height="60" rx="8"/>
<text class="tb" x="360.0" y="54.0" text-anchor="middle">ResourceManager</text>
<text class="ts" x="360.0" y="72.0" text-anchor="middle">marks 5 failed</text>
<rect class="bx2" x="270" y="170" width="180" height="56" rx="8"/>
<text class="tb" x="360.0" y="194.0" text-anchor="middle">ApplicationMaster</text>
<text class="ts" x="360.0" y="212.0" text-anchor="middle">restart: max 2 tries</text>
<rect class="bx3" x="30" y="304" width="170" height="56" rx="8"/>
<text class="tb" x="115.0" y="328.0" text-anchor="middle">NodeManager 1</text>
<text class="ts" x="115.0" y="346.0" text-anchor="middle">new containers</text>
<rect class="bx3" x="275" y="304" width="170" height="56" rx="8"/>
<text class="tb" x="360.0" y="328.0" text-anchor="middle">NodeManager 3</text>
<text class="ts" x="360.0" y="346.0" text-anchor="middle">new containers</text>
<rect class="bx" x="520" y="304" width="170" height="56" rx="8" stroke-dasharray="6 4"/>
<text class="tb" x="605" y="327" text-anchor="middle">NodeManager 2</text>
<text class="ts" x="605" y="345" text-anchor="middle">dead: 5 containers</text>
<line class="ln" x1="250" y1="58" x2="182" y2="58" stroke-dasharray="5 4" marker-end="url(#ah-w05b)"/>
<text class="ts" x="216" y="50" text-anchor="middle">failover</text>
<path class="ln" d="M605,302 L605,58 L472,58" stroke-dasharray="5 4" marker-end="url(#ah-w05b)"/>
<text class="ts" x="597" y="140" text-anchor="end">1 heartbeats stop</text>
<text class="ts" x="597" y="156" text-anchor="end">(&gt;10 min)</text>
<line class="ln" x1="330" y1="88" x2="330" y2="168" marker-end="url(#ah-w05b)"/>
<text class="ts" x="322" y="134" text-anchor="end">2 notify</text>
<line class="ln" x1="390" y1="168" x2="390" y2="90" marker-end="url(#ah-w05b)"/>
<text class="ts" x="398" y="134" text-anchor="start">3 re-request</text>
<line class="ln" x1="300" y1="226" x2="140" y2="302" marker-end="url(#ah-w05b)"/>
<text class="ts" x="214" y="252" text-anchor="end">4 relaunch</text>
<line class="ln" x1="360" y1="226" x2="360" y2="302" marker-end="url(#ah-w05b)"/>
<text class="ts" x="368" y="268" text-anchor="start">4 relaunch</text>
<text class="ts" x="360" y="392" text-anchor="middle">Tasks rerun from HDFS replicas of their input</text>
</svg>
