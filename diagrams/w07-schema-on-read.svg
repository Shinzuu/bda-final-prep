<text class="tb" x="305.0" y="147.0" text-anchor="middle">"abc" rejected</text>
<polyline class="ln" points="170,67 223,67" marker-end="url(#ah-w07b)"/>
<polyline class="ln" points="385,67 438,67" marker-end="url(#ah-w07b)"/>
