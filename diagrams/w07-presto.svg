<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 410" font-family="Inter, Segoe UI, system-ui, sans-serif">
<style>.bx{fill:var(--d-box,#fff7ed);stroke:var(--d-line,#b45309);stroke-width:1.5}
