<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Inter, Segoe UI, system-ui, sans-serif">
<style>.bx{fill:var(--d-box,#fff7ed);stroke:var(--d-line,#b45309);stroke-width:1.5}
.bx2{fill:var(--d-box2,#eff6ff);stroke:var(--d-line2,#1d4ed8);stroke-width:1.5}
.bx3{fill:var(--d-box3,#ecfdf3);stroke:var(--d-line3,#15803d);stroke-width:1.5}
.ln{stroke:var(--d-ink,#44403c);stroke-width:1.5;fill:none}
.t{fill:var(--d-ink,#1c1b19);font-size:14px}.tb{fill:var(--d-ink,#1c1b19);font-size:14px;font-weight:600}
.ts{fill:var(--d-mute,#78716c);font-size:12px}</style>
<defs><marker id="ah-w05d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--d-ink,#44403c)"/></marker></defs>
<text class="tb" x="180" y="34" text-anchor="middle">Row store (CSV, Avro)</text>
<text class="tb" x="540" y="34" text-anchor="middle">Columnar (Parquet, ORC)</text>
